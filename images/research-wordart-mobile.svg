<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
  <title id="title">Research themes over the Oxford skyline</title>
  <desc id="desc">Selected research topics arranged across a soft Oxford skyline.</desc>
  <rect width="600" height="300" fill="#f8f8f3"/>
  <image href="/images/oxskyline-small-cropped.png" x="0" y="68" width="600" height="141" opacity=".19" preserveAspectRatio="none"/>
  <path d="M20 276H580" stroke="#b8c9be" stroke-width="1"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="650" text-anchor="middle">
    <text x="164" y="66" font-size="19" fill="#557a70" transform="rotate(-5 164 66)">learning dynamics</text>
    <text x="444" y="66" font-size="20" fill="#9b7138" transform="rotate(4 444 66)">optimization</text>
    <text x="300" y="145" font-size="39" font-weight="760" letter-spacing="-1.1" fill="#244c44">collective</text>
    <text x="300" y="188" font-size="44" font-weight="760" letter-spacing="-1.4" fill="#244c44">training</text>
    <text x="130" y="231" font-size="22" fill="#286b5c" transform="rotate(-4 130 231)">protocol learning</text>
    <text x="408" y="231" font-size="21" fill="#9b7138" transform="rotate(4 408 231)">compression</text>
    <text x="123" y="267" font-size="17" fill="#557a70">pipeline parallelism</text>
    <text x="424" y="267" font-size="17" fill="#356b60">decentralized training</text>
  </g>
</svg>
